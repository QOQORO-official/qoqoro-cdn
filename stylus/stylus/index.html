<!DOCTYPE html>
<!-- Pro Stylus Notes static entry point. Keep alongside stylus.wasm and nim-runtime/. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pro Stylus Notes · Nim WebAssembly</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231e293b'/%3E%3Cpath d='M8 24 L22 8 l3 3 L11 25 z' fill='%233b82f6'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f0f2f5; }
  #app { width: 100%; height: 100%; }
  #nim-console { position: fixed; left: 12px; bottom: 12px; z-index: 1000; margin: 0; padding: 10px 14px;

    border-radius: 8px; white-space: pre-wrap; max-width: 60vw; }
  #nim-console:empty { display: none; }
  #nim-console .stderr { color: #f08c8c; }
</style>
</head>
<body>
<div id="app"></div>
<pre id="nim-console"></pre>
<script src="../protected-resources.js"></script>
<script>window.__APP_WASM_URL__ = "stylus.wasm";</script>
<script src="nim-runtime/wasi-shim.js"></script>
<script src="nim-runtime/stylus-host.js"></script>
<script src="nim-runtime/bindweb-runtime.js"></script>
<script src="nim-runtime/run-wasm.js"></script>
<script src="nim-runtime/boot.js"></script>
</body>
</html>
