<!DOCTYPE html>
<html>

<head lang='en'>
	<meta charset='utf-8'>
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta name="renderer" content="webkit" />
	<meta name="viewport" content="width=device-width, initial-scale=1,user-scalable=0" />
	<title>QoqoroSheet</title>

	<!-- Use local CSS files -->
	<link rel="stylesheet" href="plugins/css/pluginsCss.css?v=4e7008f27cbc" />
	<link rel="stylesheet" href="plugins/plugins.css?v=4e7008f27cbc" />
	<link rel="stylesheet" href="css/luckysheet.css?v=4e7008f27cbc" />
	<link rel="stylesheet" href="css/sheetapp-topbar.css?v=4e7008f27cbc" />
	<link rel="stylesheet" href="css/chart-panel.css?v=4e7008f27cbc" />
	<link rel="stylesheet" href="css/origin-studio.css?v=4e7008f27cbc" />
	<link rel="stylesheet" href="assets/iconfont/iconfont.css?v=4e7008f27cbc" />
	<style>
		/* Keep the page exactly viewport-sized so the in-canvas Y-scrollbar,
		   which is pinned to the grid container's right edge, never lands
		   off-screen and forces a horizontal page scroll. */
		html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
	</style>
</head>

<body>
	<div id="luckysheet" style="box-sizing:border-box;margin:0px;padding:0px;position:absolute;width:100%;height:100%;left: 0px;top: 0px;overflow:hidden;">
	</div>

	<!-- Loading Progress Modal -->
	<div id="loadingOverlay" class="loading-overlay" style="display:none;">
		<div class="loading-modal">
			<div class="loading-icon">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
					<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
					<polyline points="14 2 14 8 20 8"></polyline>
				</svg>
			</div>
			<div class="loading-title">Opening File</div>
			<div class="loading-filename" id="loadingFileName"></div>
			<div class="loading-stage" id="loadingStage">Preparing...</div>
			<div class="loading-progress-track">
				<div class="loading-progress-fill" id="loadingProgressFill" style="width:0%"></div>
			</div>
			<div class="loading-percent" id="loadingPercent">0%</div>
			<div class="loading-detail" id="loadingDetail"></div>
			<div class="loading-spinner" id="loadingSpinner">
				<div class="spinner-ring"></div>
			</div>
			<button class="loading-cancel-btn" id="loadingCancelBtn">Cancel</button>
		</div>
	</div>

	<div class="script-overlay" id="scriptOverlay">
		<div class="script-modal" id="scriptModal">
			<div class="script-header">
				<div class="script-header-title">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
						<polyline points="16 18 22 12 16 6" />
						<polyline points="8 6 2 12 8 18" />
					</svg>
					Custom Program (Luau)
					<span id="scriptSavedDot"
						style="width:6px;height:6px;border-radius:50%;background:#45475a;display:inline-block;margin-left:2px;transition:background .3s"
						title="Unsaved changes"></span>
				</div>
				<div class="script-header-actions">
					<div class="autorun-wrap" id="autorunToggle" title="Run this script automatically whenever a file is opened">
						<div class="autorun-checkbox">
							<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.5">
								<polyline points="1.5 6 4.5 9 10.5 3" />
							</svg>
						</div>
						Autorun on file open
					</div>

					<button class="script-btn-run" id="scriptRunBtn">
						<svg viewBox="0 0 24 24" fill="currentColor">
							<polygon points="5 3 19 12 5 21 5 3" />
						</svg>
						Run
					</button>

					<button class="script-btn-close" id="scriptCloseBtn" title="Close (Esc)">x</button>
				</div>
			</div>

			<div class="script-template-bar">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
					style="width:13px;height:13px;color:#cba6f7;flex-shrink:0">
					<rect x="3" y="3" width="7" height="7" rx="1" />
					<rect x="14" y="3" width="7" height="7" rx="1" />
					<rect x="3" y="14" width="7" height="7" rx="1" />
					<rect x="14" y="14" width="7" height="7" rx="1" />
				</svg>
				<span class="tpl-label">Templates</span>
				<select id="templateSelect" class="tpl-select"></select>
				<button id="templateLoadBtn" class="tpl-load-btn">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
						style="width:12px;height:12px">
						<path d="M12 5v14M5 12l7 7 7-7" />
					</svg>
					Load
				</button>
				<button id="templateSaveBtn" class="tpl-load-btn" style="margin-left: 4px; color: #a6e3a1" title="Save current script as template">
					Save
				</button>
				<button id="templateDeleteBtn" class="tpl-load-btn" style="margin-left: 4px; color: #f38ba8" title="Delete selected template">
					Del
				</button>
				<span id="templateDesc" class="tpl-desc"></span>
			</div>

			<div class="script-body">
				<div class="script-editor-wrap">
					<div class="script-gutter" id="scriptGutter"></div>
					<textarea class="script-textarea" id="scriptTextarea" spellcheck="false" autocomplete="off"
						autocorrect="off" autocapitalize="off" placeholder="-- Write Luau here (Roblox's typed Lua). Rows and columns start at 1: Cell(1, 1) is A1.
--   ActiveSheet, Sheets[1], Sheets[&quot;Data&quot;], AddSheet(&quot;Results&quot;)
--   sheet:Cell(r, c)  sheet:Text(r, c)  sheet:SetCell(r, c, value)  sheet:SetFormula(r, c, &quot;=SUM(A1:A9)&quot;)
--   sheet:LastRow()  sheet:LastColumn()  sheet:Row(r)  sheet:Column(c)  sheet:Find(&quot;Time&quot;)
--   sheet:Range(&quot;A1:C10&quot;):Values()  :SetValues(t)  sheet:UsedRange()
--   Charts.Add{ option = { ... } }   (an ECharts option table)
--   InputBox(prompt, default)  MsgBox(text)  Confirm(text)  print / warn / info
--   OriginStudio.OpenGraphEditor()  FileName  Json.Encode / Json.Decode
-- The workbook changes when the program ends, all at once.
"></textarea>
				</div>

				<div class="script-console">
					<div class="script-console-bar">
						<div class="console-dot" id="consoleDot"></div>
						Console
						<button class="console-clear-btn" id="consoleClearBtn">Clear</button>
					</div>
					<div class="script-console-output" id="consoleOutput">
						<p class="con-line info">// Ready. Press Run or Ctrl+Enter to execute.</p>
					</div>
				</div>
			</div>

			<div class="script-footer">
				<span><kbd>Ctrl</kbd>+<kbd>Enter</kbd> Run</span>
				<span><kbd>Esc</kbd> Close</span>
				<span><kbd>Tab</kbd> Indent</span>
			</div>
		</div>
	</div>

	<script src="../protected-resources.js?v=4e7008f27cbc"></script>
<script src="js/hostAuth.js?v=4e7008f27cbc"></script>
	<script src="js/workerUrl.js?v=4e7008f27cbc"></script>
	<script type="module" src="src/main.js?v=4e7008f27cbc"></script>
	<script src="js/scriptTemplates.js?v=4e7008f27cbc"></script>
	<script src="js/originStudioCore.js?v=4e7008f27cbc"></script>
	<script src="js/sheetLuau.js?v=4e7008f27cbc"></script>
	<script src="js/customProgram.js?v=4e7008f27cbc"></script>
	<script src="js/visualScriptBridge.js?v=4e7008f27cbc"></script>
	<script>
		(function () {
			function showToast(msg, type, duration) {
				var el = document.getElementById('_toast');
				if (!el) {
					el = document.createElement('div');
					el.id = '_toast';
					el.style.cssText = 'position:fixed;bottom:20px;right:20px;z-index:99999;padding:9px 16px;border-radius:7px;font-family:sans-serif;font-size:13px;font-weight:500;color:#11111b;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:opacity .2s';
					document.body.appendChild(el);
				}
				el.textContent = msg;
				el.style.background = type === 'error' ? '#f38ba8' : type === 'warn' ? '#f9e2af' : type === 'success' ? '#a6e3a1' : '#89b4fa';
				el.style.opacity = '1';
				clearTimeout(window.__sheetAppToastTimer);
				window.__sheetAppToastTimer = setTimeout(function () { el.style.opacity = '0'; }, duration || 3000);
			}

			function initCustomProgramWhenReady() {
				if (!window.CustomProgram || !document.getElementById('openScriptEditor')) return false;
				window.CustomProgram.init({ showToast: showToast });
				return true;
			}

			document.addEventListener('DOMContentLoaded', function () {
				if (initCustomProgramWhenReady()) return;
				var observer = new MutationObserver(function () {
					if (initCustomProgramWhenReady()) observer.disconnect();
				});
				observer.observe(document.body, { childList: true, subtree: true });
			});
		})();
	</script>
</body>

</html>
