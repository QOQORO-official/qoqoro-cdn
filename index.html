<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QNote Vault</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Ctext x='6' y='24' fill='white' font-size='24'%3EQ%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="workspace.css">
</head>
<body>
<header class="vault-header">
  <strong>QNote Vault</strong>
  <span id="currentNote">No vault note selected</span>
  <button id="saveVault" type="button" title="Save (Ctrl+S)">Save</button>
  <button id="refreshVault" type="button">Refresh</button>
  <button id="serverSettings" type="button" title="Which QNote Vault server this page talks to">Server</button>
  <a href="admin.html" id="adminLink" hidden>Vault &amp; Admin</a>
  <button id="logout" type="button">Sign out</button>
</header>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-title-row">
      <span class="workspace-name" title="">Vault</span>
      <span class="sidebar-actions">
        <button id="newNoteHeaderBtn" type="button" title="New note">+ Note</button>
        <button id="newFolderHeaderBtn" type="button" title="New folder">+ Folder</button>
        <button id="uploadHeaderBtn" type="button" title="Upload PDF or QNote">↥ Upload</button>
      </span>
    </div>
    <input id="fileSearch" class="search-box" placeholder="Search notes…" aria-label="Search notes">
    <div class="sidebar-status" id="sendStatus">Loading vault…</div>
    <button id="vaultRoot" type="button" class="vault-root">Vault root</button>
    <div id="fileList" class="file-list" role="tree"></div>
  </aside>
  <div id="paneDivider" class="pane-divider" role="separator" aria-label="Resize sidebar"></div>
  <main class="main-panel">
    <div class="iframe-wrap">
      <iframe id="editorFrame" name="editorFrame" title="QNote editor" allow="clipboard-read; clipboard-write"></iframe>
    </div>
  </main>
</div>
<div id="context" hidden role="menu"></div>
<script src="vault-client.js"></script>
<script src="workspace.js"></script>
</body>
</html>
